[workspace]
name = "geodex_moveit"
version = "1.0.0"
description = "MoveIt 2 planner plugin for planning on Riemannian configuration spaces, built on geodex"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", { platform = "osx-arm64", macos = "15.0" }]
requires-pixi = ">=0.81.0"

# Build tools shared by every distribution.
[dependencies]
cmake = "==4.4.3"
ninja = "==1.13.2"
compilers = "==1.11.0"
git = "==2.55.0"
make = "==4.4.1"
pkg-config = "==0.29.2"
colcon-common-extensions = "==0.3.0"
libboost-devel = "==1.90.0"
yaml-cpp = "==0.8.0"
numpy = "==2.5.3"
pyyaml = "==6.0.3"

# GCC 14.3.0 built the exact replay fixtures of geodex_moveit's tests, and the pin reproduces
# their floating point.
[target.linux-64.dependencies]
gcc_linux-64 = "==14.3.0"
gxx_linux-64 = "==14.3.0"

[feature.jazzy]
channels = ["https://prefix.dev/robostack-jazzy"]

[feature.jazzy.dependencies]
python = "==3.12.14"
ros-jazzy-ament-cmake = "==2.5.6"
ros-jazzy-ament-cmake-clang-format = "==0.17.5"
ros-jazzy-ament-cmake-gtest = "==2.5.6"
ros-jazzy-ament-cmake-ros = "==0.12.1"
ros-jazzy-ament-lint-auto = "==0.17.5"
ros-jazzy-ament-lint-common = "==0.17.5"
ros-jazzy-controller-manager = "==4.47.0"
ros-jazzy-generate-parameter-library = "==0.7.6"
ros-jazzy-joint-state-broadcaster = "==4.42.1"
ros-jazzy-joint-trajectory-controller = "==4.42.1"
ros-jazzy-launch-testing-ament-cmake = "==3.4.11"
ros-jazzy-launch-testing-ros = "==0.26.12"
ros-jazzy-moveit-configs-utils = "==2.12.4"
ros-jazzy-moveit-core = "==2.12.4"
ros-jazzy-moveit-kinematics = "==2.12.4"
ros-jazzy-moveit-planners-ompl = "==2.12.4"
ros-jazzy-moveit-resources-panda-description = "==3.1.0"
ros-jazzy-moveit-resources-panda-moveit-config = "==3.1.0"
ros-jazzy-moveit-ros-move-group = "==2.12.4"
ros-jazzy-moveit-ros-planning = "==2.12.4"
ros-jazzy-moveit-ros-visualization = "==2.12.4"
ros-jazzy-moveit-simple-controller-manager = "==2.12.4"
ros-jazzy-pluginlib = "==5.4.5"
ros-jazzy-rclcpp = "==28.1.21"
ros-jazzy-rmw-cyclonedds-cpp = "==2.2.3"
ros-jazzy-robot-state-publisher = "==3.3.4"
ros-jazzy-ros2-control = "==4.47.0"
ros-jazzy-rviz-visual-tools = "==4.2.0"
ros-jazzy-rviz2 = "==14.1.23"
ros-jazzy-xacro = "==2.1.1"

[feature.lyrical]
channels = ["https://prefix.dev/robostack-lyrical"]

[feature.lyrical.dependencies]
python = "==3.14.7"
ros-lyrical-ament-cmake = "==2.8.8"
ros-lyrical-ament-cmake-clang-format = "==0.20.6"
ros-lyrical-ament-cmake-gtest = "==2.8.8"
ros-lyrical-ament-cmake-ros = "==0.15.8"
ros-lyrical-ament-lint-auto = "==0.20.6"
ros-lyrical-ament-lint-common = "==0.20.6"
ros-lyrical-controller-manager = "==6.10.0"
ros-lyrical-generate-parameter-library = "==1.3.0"
ros-lyrical-joint-state-broadcaster = "==6.9.0"
ros-lyrical-joint-trajectory-controller = "==6.9.0"
ros-lyrical-launch-testing-ament-cmake = "==3.9.8"
ros-lyrical-launch-testing-ros = "==0.29.9"
ros-lyrical-moveit-configs-utils = "==2.15.1"
ros-lyrical-moveit-core = "==2.15.1"
ros-lyrical-moveit-kinematics = "==2.15.1"
ros-lyrical-moveit-planners-ompl = "==2.15.1"
ros-lyrical-moveit-resources-panda-description = "==3.2.0"
ros-lyrical-moveit-resources-panda-moveit-config = "==3.2.0"
ros-lyrical-moveit-ros-move-group = "==2.15.1"
ros-lyrical-moveit-ros-planning = "==2.15.1"
ros-lyrical-moveit-ros-visualization = "==2.15.1"
ros-lyrical-moveit-simple-controller-manager = "==2.15.1"
ros-lyrical-pluginlib = "==5.8.5"
ros-lyrical-rclcpp = "==32.0.3"
ros-lyrical-rmw-cyclonedds-cpp = "==4.1.5"
ros-lyrical-robot-state-publisher = "==3.5.5"
ros-lyrical-ros2-control = "==6.10.0"
ros-lyrical-rviz-visual-tools = "==4.2.0"
ros-lyrical-rviz2 = "==15.2.5"
ros-lyrical-xacro = "==2.1.1"

[environments]
jazzy = { features = ["jazzy"], no-default-feature = false }
lyrical = { features = ["lyrical"], no-default-feature = false }

[activation.env]
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
CYCLONEDDS_URI = "file://$PIXI_PROJECT_ROOT/scripts/cyclonedds_localhost.xml"

[tasks.build-geodex]
description = "Build geodex, the OMPL fork and VAMP from pinned sources into .pixi/deps/<env>"
cmd = "bash scripts/build_deps.sh .pixi/deps/$PIXI_ENVIRONMENT_NAME"

[tasks.build]
description = "Build both packages with colcon"
cmd = """colcon build --base-paths geodex_moveit geodex_moveit_demos \
         --build-base build/$PIXI_ENVIRONMENT_NAME \
         --install-base install/$PIXI_ENVIRONMENT_NAME --event-handlers console_cohesion+ \
         --cmake-args -G Ninja -DCMAKE_BUILD_TYPE=Release \
         -DCMAKE_PREFIX_PATH=$PIXI_PROJECT_ROOT/.pixi/deps/$PIXI_ENVIRONMENT_NAME"""
depends-on = ["build-geodex"]

[tasks.test]
description = "Build, then run every test and print the results"
cmd = """colcon test --base-paths geodex_moveit geodex_moveit_demos \
         --build-base build/$PIXI_ENVIRONMENT_NAME \
         --install-base install/$PIXI_ENVIRONMENT_NAME --event-handlers console_cohesion+ \
         --return-code-on-test-failure \
         && colcon test-result --test-result-base build/$PIXI_ENVIRONMENT_NAME --verbose"""
depends-on = ["build"]
